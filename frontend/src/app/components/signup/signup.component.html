<div class="auth-page">
  <div class="auth-card">
    <p class="auth-card__eyebrow">Registry Access</p>
    <h2 class="auth-card__title">Create Account</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" formControlName="username" autocomplete="username" />
        <small class="error" *ngIf="f['username'].touched && f['username'].invalid">At least 3 characters.</small>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password" />
        <small class="error" *ngIf="f['password'].touched && f['password'].invalid">At least 6 characters.</small>
      </div>

      <app-captcha (valueChange)="captcha = $event"></app-captcha>

      <button type="submit" class="stamp-btn" [disabled]="submitting">
        {{ submitting ? 'Creating…' : 'Create Account' }}
      </button>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

    <p class="auth-card__switch">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
